<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title>TWPay QRCode Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
    integrity="sha512-b2QcS5SsA8tZodcDtGRELiGv5SaKSk1vDHDaQRda0htPYWZ6046lr3kJ5bAAQdpV2mmA/4v0wQF9MyU6/pDIAg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./style.css" />
  <!-- Google API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
</head>

<body>

  <div id="app" class="text-center">
    <main class="form-generator" v-show="!showResult">
      <form id="generator" @submit.prevent="generateCode">
        <h1 class="h3 mb-3 fw-normal">TWPay QRCode Generator</h1>

        <!-- 模式切換 -->
        <div class="mode-switch mb-3">
          <p class="text-muted small mb-2">您目前使用的是：<span>{{ modeText }}</span></p>
          <div class="btn-group w-100" role="group">
            <button type="button" class="btn btn-outline-primary" :class="{ active: currentMode === 1 }"
              @click="switchMode(1)">一般模式</button>
            <button type="button" class="btn btn-outline-primary" :class="{ active: currentMode === 2 }"
              @click="switchMode(2)">繳費模式</button>
          </div>
        </div>

        <!-- 繳費類別 (僅繳費模式顯示) -->
        <div class="form-floating" v-show="isPaymentMode">
          <select class="form-select" v-model="formData.paymentCategory">
            <option value="">請選擇費用名稱</option>
            <optgroup v-for="category in paymentCategories" :key="category.group" :label="category.group">
              <option v-for="item in category.items" :key="item.value" :value="item.value">
                {{ item.label }}
              </option>
            </optgroup>
          </select>
          <label>繳費類別</label>
        </div>

        <!-- 銀行代碼選單 (繳費模式下隱藏) -->
        <div class="form-floating" v-show="!isPaymentMode">
          <input type="text" class="form-control" list="bank_list" v-model="formData.bankCode" placeholder="3 位數字">
          <datalist id="bank_list">
            <option v-for="bank in bankList" :key="bank.code" :value="bank.code">{{ bank.name }}</option>
          </datalist>
          <label>銀行代碼</label>
        </div>

        <!-- 格式提示區塊 -->
        <div class="alert alert-info format-hint" v-show="currentHint">
          <small>{{ currentHint }}</small>
        </div>

        <!-- 帳號/銷帳編號 -->
        <div class="form-floating">
          <input type="text" class="form-control" v-model="formData.accountNumber" placeholder="1-16 位數字">
          <label>{{ accountLabel }}</label>
        </div>

        <!-- 轉帳金額 -->
        <div class="form-floating">
          <input type="number" class="form-control" v-model="formData.amount" placeholder="請輸入金額">
          <label>{{ isPaymentMode ? '繳費金額(若為空，掃碼可設定金額)' : '轉帳金額(若為空，掃碼可設定金額)' }}</label>
        </div>

        <!-- 備註資料 (僅一般模式顯示) -->
        <div class="form-floating" v-show="!isPaymentMode">
          <input type="text" class="form-control" v-model="formData.memo" placeholder="備註" maxlength="19">
          <label>備註資料(超過19字元之部分將忽略)</label>
        </div>

        <!-- QR Code 大小 -->
        <div class="form-check text-start my-3">
          <label class="form-check-label">
            QR Code 大小：
            <input type="number" v-model.number="formData.qrSize" min="150" max="500" step="50"
              style="width: 80px; margin-left: 10px;">
            px
          </label>
        </div>

        <button class="w-100 btn btn-lg btn-primary" type="submit">Generator</button>

        <!-- Google Drive 功能區 -->
        <div class="mt-3">
          <!-- 未連接：顯示連接按鈕 -->
          <div v-if="!isGoogleDriveConnected" class="text-center">
            <button type="button" class="btn btn-outline-primary w-100" @click="toggleGoogleDrive">
              🔗 連接 Google Drive 儲存資料
            </button>
            <small class="text-muted d-block mt-2">連接後可儲存常用資料到雲端</small>
          </div>

          <!-- 已連接：顯示儲存/載入按鈕 -->
          <div v-else>
            <div class="row g-2">
              <div class="col-6">
                <button type="button" class="w-100 btn btn-success" @click="showSaveDialog = true">
                  💾 儲存到雲端
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="w-100 btn btn-info" @click="openLoadDialog">
                  📂 載入資料
                </button>
              </div>
            </div>
            <div class="text-center mt-2">
              <small class="text-muted">已連接 Google Drive</small>
              <button type="button" class="btn btn-link btn-sm text-muted p-0 ms-2" @click="toggleGoogleDrive">
                (登出)
              </button>
            </div>
          </div>
        </div>

        <p class="mt-5 mb-3 text-muted">BlueCat &copy; 2025</p>
      </form>
    </main>

    <!-- 結果顯示 -->
    <div class="row" v-show="showResult">
      <div class="card card-body">
        <img v-if="resultQRCode" :src="resultQRCode" class="rounded mx-auto d-block" alt="QRCode">
      </div>
      <button type="button" class="btn btn-secondary" @click="goBack">Back</button>
    </div>

    <!-- Alert Modal -->
    <div class="modal fade" id="AlertModal" tabindex="-1" aria-labelledby="AlertLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="AlertLabel">提示</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            {{ alertMessage }}
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Save Modal -->
    <div class="modal fade" :class="{ show: showSaveDialog }" :style="{ display: showSaveDialog ? 'block' : 'none' }"
      tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">儲存到 Google Drive</h5>
            <button type="button" class="btn-close" @click="showSaveDialog = false"></button>
          </div>
          <div class="modal-body">
            <input type="text" class="form-control" v-model="saveItemName" placeholder="請輸入名稱（例如：台水繳費）">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="showSaveDialog = false">取消</button>
            <button type="button" class="btn btn-primary" @click="saveToGoogleDrive">儲存</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop fade" :class="{ show: showSaveDialog }" v-if="showSaveDialog"></div>

    <!-- Load Modal -->
    <div class="modal fade" :class="{ show: showLoadDialog }" :style="{ display: showLoadDialog ? 'block' : 'none' }"
      tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">從 Google Drive 載入</h5>
            <div>
              <button type="button" class="btn btn-sm btn-outline-primary me-2" @click="refreshData" title="重新整理">
                🔄 重新整理
              </button>
              <button type="button" class="btn-close" @click="showLoadDialog = false"></button>
            </div>
          </div>
          <div class="modal-body">
            <div v-if="loadingData" class="text-center p-3">
              <div class="spinner-border" role="status"></div>
              <p>載入中...</p>
            </div>
            <div v-else-if="savedDataList.length === 0" class="text-center p-3 text-muted">
              尚無儲存的資料
            </div>
            <div v-else class="list-group">
              <div v-for="item in savedDataList" :key="item.id"
                class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="mb-1">{{ item.name }}</h6>
                  <small class="text-muted">{{ item.mode === 1 ? '一般模式' : '繳費模式' }} | {{ formatDate(item.timestamp)
                    }}</small>
                </div>
                <div>
                  <button class="btn btn-sm btn-primary me-2" @click="loadSavedItem(item)">載入</button>
                  <button class="btn btn-sm btn-danger" @click="deleteSavedItem(item.id)">刪除</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop fade" :class="{ show: showLoadDialog }" v-if="showLoadDialog"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"
    integrity="sha512-X/YkDZyjTf4wyc2Vy16YGCPHwAY8rZJY+POgokZjQB2mhIRFJCckEGc6YyX9eNsPfn0PzThEuNs+uaomE5CO6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="./script.js"></script>
</body>

</html>
