<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title>TWPay QRCode Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
    integrity="sha512-b2QcS5SsA8tZodcDtGRELiGv5SaKSk1vDHDaQRda0htPYWZ6046lr3kJ5bAAQdpV2mmA/4v0wQF9MyU6/pDIAg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="text-center">

  <main class="form-generator">
    <form id="generator">
      <h1 class="h3 mb-3 fw-normal">TWPay QRCode Generator</h1>

      <!-- 模式切換 -->
      <div class="mode-switch mb-3">
        <p class="text-muted small mb-2">您目前使用的是：<span id="current_mode">一般轉帳模式</span></p>
        <div class="btn-group w-100" role="group">
          <button type="button" class="btn btn-outline-primary active" id="mode_normal">一般模式</button>
          <button type="button" class="btn btn-outline-primary" id="mode_payment">繳費模式</button>
        </div>
      </div>

      <!-- 繳費類別 (僅繳費模式顯示) -->
      <div class="form-floating d-none" id="payment_category_wrapper">
        <select class="form-select" id="input_payment_category">
          <option value="">請選擇費用名稱</option>

          <optgroup label="==信用卡帳單==">
            <option value="006,006A,合庫信用卡">006合作金庫 (免手續費)</option>
            <option value="007,007A,信用卡費">007第一銀行 (免手續費)</option>
            <option value="008,008A,華南銀行信用卡費">008華南銀行 (免手續費)</option>
            <option value="009,009A,彰化銀行信用卡費">009彰化銀行 (免手續費)</option>
            <option value="017,017A,兆豐商銀信用卡費">017兆豐商銀 (手續費:10元)</option>
            <option value="103,103A,新光銀行信用卡繳款－ＶＩＳＡ　ＱＲ">103新光銀行 (免手續費)</option>
            <option value="805,805A,遠東商銀信用卡繳款-VisaQRCode">805遠東商銀 (免手續費)</option>
            <option value="807,807B,永豐信用卡帳單繳費">807永豐銀行 (手續費:10元)</option>
          </optgroup>

          <optgroup label="==公用事業費==">
            <option value="007,007G,電信費">亞太電信 (已併入遠傳)</option>
            <option value="017,017T,台灣之星電信股份有限公司">台灣之星 (已併入TWM)</option>
            <option value="006,0061,台灣自來水">台灣自來水 (免手續費)</option>
          </optgroup>

          <optgroup label="==政府保險費==">
            <option value="004,0041,衛生福利部中央健康保險署">健保 (手續費:3元)</option>
            <option value="004,0040,國保">國民年金 (手續費:3元)</option>
          </optgroup>
        </select>
        <label for="input_payment_category">繳費類別</label>
      </div>

      <!-- 銀行代碼選單 (繳費模式下隱藏) -->
      <div class="form-floating" id="bank_code_wrapper">
        <input type="text" class="form-control" id="input_bank" list="bank_list" placeholder="3 位數字" autocomplete="off">
        <datalist id="bank_list">
          <option value="004">臺灣銀行</option>
          <option value="005">台灣土地銀行</option>
          <option value="006">合作金庫商業銀行</option>
          <option value="007">第一商業銀行</option>
          <option value="008">華南商業銀行</option>
          <option value="009">彰化商業銀行</option>
          <option value="011">上海商業儲蓄銀行</option>
          <option value="012">台北富邦商業銀行</option>
          <option value="013">國泰世華商業銀行</option>
          <option value="016">高雄銀行</option>
          <option value="017">兆豐國際商業銀行</option>
          <option value="018">全國農業金庫</option>
          <option value="021">花旗（台灣）銀行</option>
          <option value="040">中華開發金控</option>
          <option value="048">王道商業銀行</option>
          <option value="050">台灣中小企業銀行</option>
          <option value="052">渣打國際商業銀行</option>
          <option value="053">台中商業銀行</option>
          <option value="054">京城商業銀行</option>
          <option value="081">滙豐（台灣）商業銀行</option>
          <option value="101">瑞興商業銀行</option>
          <option value="102">華泰商業銀行</option>
          <option value="103">台灣新光商業銀行</option>
          <option value="108">陽信商業銀行</option>
          <option value="118">板信商業銀行</option>
          <option value="700">中華郵政股份有限公司</option>
          <option value="803">聯邦商業銀行</option>
          <option value="805">遠東國際商業銀行</option>
          <option value="806">元大商業銀行</option>
          <option value="807">永豐商業銀行</option>
          <option value="808">玉山商業銀行</option>
          <option value="809">凱基商業銀行</option>
          <option value="810">星展（台灣）商業銀行</option>
          <option value="812">台新國際商業銀行</option>
          <option value="815">日盛國際商業銀行</option>
          <option value="816">安泰商業銀行</option>
          <option value="822">中國信託商業銀行</option>
          <option value="823">將來銀行(Next Bank)</option>
          <option value="824">連線商業銀行(LINE Bank)</option>
          <option value="826">樂天國際商業銀行</option>
          <option value="388">全盈支付</option>
          <option value="389">全支付</option>
          <option value="390">悠遊付</option>
          <option value="391">一卡通(iPassMoney)</option>
          <option value="392">愛金卡(icasH Pay)</option>
        </datalist>
        <label for="input_bank">銀行代碼</label>
      </div>

      <!-- 帳號 -->
      <div class="form-floating">
        <input type="text" class="form-control" id="input_acc" placeholder="1-16 位數字">
        <label for="input_acc" id="label_acc">帳號/銷帳編號</label>
      </div>

      <!-- 格式提示區塊 -->
      <div id="format_hint" class="alert alert-info format-hint d-none">
        <small id="format_hint_text"></small>
      </div>

      <!-- 金額 -->
      <div class="form-floating">
        <input type="text" class="form-control" id="input_amount" placeholder="1-7 位數字">
        <label for="input_amount">金額(若為空，掃碼可設定金額)</label>
      </div>

      <!-- 備註 -->
      <div class="form-floating">
        <input type="text" class="form-control" id="input_memo" placeholder="1-19 位字串">
        <label for="input_memo">備註(超過19字元之部分將忽略)</label>
      </div>

      <!-- 產生QR圖片 -->
      <div class="checkbox mb-3">
        <input class="form-check-input" type="checkbox" value="300" id="input_redir" checked>
        <label class="form-check-label" for="input_redir">產生QR圖片</label>
      </div>

      <button class="w-100 btn btn-lg btn-primary" type="button">Generator</button>

      <p class="mt-5 mb-3 text-muted">BlueCat &copy; 2025</p>
    </form>
  </main>


  <div class="row d-none" id="collapseExample">
    <div class="card card-body">
      ...
    </div>
    <button type="button" class="btn btn-secondary">Back</button>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="AlertModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Message</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          ...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"
    integrity="sha512-X/YkDZyjTf4wyc2Vy16YGCPHwAY8rZJY+POgokZjQB2mhIRFJCckEGc6YyX9eNsPfn0PzThEuNs+uaomE5CO6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./script.js"></script>
</body>

</html>
